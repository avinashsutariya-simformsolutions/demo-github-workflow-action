name: CI/CD Pipeline for demo-github-workflow-action

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Minimal default token permissions for CI-only workflows.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keep cache scoped to project definition changes for deterministic restore behavior.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./DemoApp/DemoApp.slnx

      - name: Build solution (Release)
        run: dotnet build ./DemoApp/DemoApp.slnx --configuration Release --no-restore

      - name: Run tests with TRX and code coverage
        run: dotnet test ./DemoApp/DemoApp.slnx --no-build --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test and coverage artifacts
        # Persist TRX and coverage outputs so failures can be diagnosed from the Actions UI.
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
