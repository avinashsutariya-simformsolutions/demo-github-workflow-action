name: CI/CD Pipeline for demo-github-workflow-action

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Minimal default token permissions for CI-only workflows.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keep cache scoped to project definition changes for deterministic restore behavior.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./DemoApp/DemoApp.slnx

      - name: Build solution (Release)
        run: dotnet build ./DemoApp/DemoApp.slnx --configuration Release --no-restore

      - name: Run tests with TRX and code coverage
        run: dotnet test ./DemoApp/DemoApp.slnx --no-build --logger trx --collect:"XPlat Code Coverage"

      - name: Publish application (Release)
        # Publish creates deployable output that can be downloaded from workflow artifacts.
        run: dotnet publish ./DemoApp/BlazorApp1/BlazorApp1.csproj --configuration Release --no-build --output ./artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazorapp1-release
          path: ./artifacts/publish
          if-no-files-found: error

      - name: Upload test and coverage artifacts
        # Persist TRX and coverage outputs so failures can be diagnosed from the Actions UI.
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  deploy-production:
    name: Deploy to Azure Web App (Production)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Grant OIDC token only to this deployment job.
    permissions:
      contents: read
      id-token: write

    # Use a protected GitHub Environment so approvals/secrets can be enforced for production.
    environment:
      name: production

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: blazorapp1-release
          path: ./artifacts/publish

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          # Store these as production environment secrets.
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # Set this as a repository variable (Settings > Secrets and variables > Actions > Variables).
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./artifacts/publish
